# GHS's own nginx site config, adapted from socx-platform's
# reference/nginx/sites/ghs.conf (ADR-050) per deploy/README.md.
#
# ghs#57 (Phase 6a): split into an API location and a static-SPA
# location, extending the reference template rather than replacing it --
# the reference template itself is left unchanged (RMS's own real split,
# infra/nginx/rms-prod-lab-01.conf in the rms repo, never updated the
# shared template either; the pattern is documented separately via the
# planned Platform ADR, not by editing reference/nginx here).
#
# /api/ -- not /api/v1/ -- is the nginx boundary, deliberately generic:
# the application itself owns the /api/v1 (and any future /api/v2)
# distinction internally (app.ts's v1Router), so adding a new API version
# later needs no nginx change at all.
#
# Deliberately no path rewriting on the API location. CS-INF-010 recorded
# a confirmed outage caused by exactly that: nginx stripped /api/ before
# proxying, so Express received a path it never expected. proxy_pass below
# has no trailing path component, so the full request URI (including
# /api/v1/...) passes through unchanged -- the app owns its own routing
# entirely. Do not add one.
#
# / falls through to the built SPA (ghs#62, Phase 6b) once it exists --
# static assets are synced to /var/www/ghs, not served from
# /opt/ghs/current directly (that directory is 750 ghs:ghs, reference/
# systemd's hardening, unreadable to nginx/www-data). Until ghs#62 ships,
# /var/www/ghs has no index.html and this location simply 404s for any
# non-API path -- expected and harmless: no consumer of the bare domain
# exists yet (no frontend, no mobile client), confirmed during Phase 6
# discovery.

server {
    listen 80;
    listen [::]:80;
    server_name ghs.socx.org.uk;

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name ghs.socx.org.uk;

    ssl_certificate     /etc/letsencrypt/live/ghs.socx.org.uk/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ghs.socx.org.uk/privkey.pem;
    include /etc/nginx/snippets/tls-baseline.conf;

    access_log /var/log/nginx/ghs-access.log;
    error_log  /var/log/nginx/ghs-error.log;

    # Makes the environment tier identifiable at the edge (OPS-010.2),
    # complementing reference/systemd's SOCX_ENV at the process level.
    add_header X-SOCX-Environment production always;

    # Application API -- proxied to the Node process, full path preserved
    # (including /api/v1/...; see the file-level note on why no rewriting).
    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Infrastructure liveness probe -- unversioned, outside /api/, proxied
    # directly to the same process.
    location = /healthz {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
    }

    # React SPA -- static build (ghs#62). try_files' fallback to
    # /index.html is what makes client-side routing work when a browser
    # loads a deep SPA route (e.g. /rounds/123) directly, not just via
    # in-app navigation.
    location / {
        root /var/www/ghs;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
