# Copied from socx-platform's reference/github/workflows/ci.yml
# (Approved), {{PLACEHOLDER}} values substituted for GHS. Stage order and
# rationale: ENG-040.2. The deploy job below is copied from reference/
# deployment/workflows/deploy-job.yml (ghs#35, Phase 3 -- Infrastructure
# Alignment) -- do not hand-roll deploy mechanics here beyond substituting
# GHS's own values.

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Install, Lint, Test, Build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ${{ secrets.CI_DB_USER }}
          POSTGRES_PASSWORD: ${{ secrets.CI_DB_PASSWORD }}
          POSTGRES_DB: ${{ secrets.CI_DB_NAME }}
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: ${{ secrets.CI_DATABASE_URL }}
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint --workspaces --if-present

      - name: Test
        run: npm test --workspaces --if-present

      - name: Build
        run: npm run build --workspaces --if-present

  # Separate job, triggered only on push to main (ENG-040.4). Real deploy
  # mechanics via reference/deployment -- ghs#35.
  deploy:
    name: Deploy
    needs: [ci]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: "prod-lab-01"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # needed so `git describe --tags` can see tags

      - name: Compute release version
        id: version
        run: |
          if git describe --tags --exact-match >/dev/null 2>&1; then
            VERSION="$(git describe --tags --exact-match)"
          else
            VERSION="0.0.0-$(git rev-parse --short HEAD)"
          fi
          echo "Deploying version: ${VERSION}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      # Full install (including devDependencies) is required here -- the
      # build step needs typescript itself, which is a devDependency.
      # Pruning happens AFTER build, not before (reference/deployment's own
      # documented real-verification finding: an --omit=dev install before
      # the build step silently resolves `tsc` to nothing usable and fails).
      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build --workspaces --if-present

      - name: Prune to production dependencies
        run: npm prune --omit=dev

      # apps/api/package.json, not the workspace root's -- the root
      # package.json has no "type" field (only the workspace member does),
      # and Node needs a "type": "module" package.json findable by walking
      # up from apps/api/dist/index.js. dist/data/migrations/*.sql is
      # already inside apps/api/dist (apps/api's own build script copies
      # them there), so a single `apps/api/dist` glob covers both the
      # compiled app and the migration runner's SQL files.
      - name: Package release
        run: |
          tar -czf release.tar.gz \
            apps/api/dist \
            apps/api/package.json \
            node_modules \
            package-lock.json

      - name: Deploy to droplet
        env:
          DROPLET_HOST: ${{ secrets.DROPLET_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          KEY_FILE="$(mktemp)"
          trap 'rm -f "$KEY_FILE"' EXIT
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$KEY_FILE"
          chmod 600 "$KEY_FILE"

          # Array, not a single string -- expanding an unquoted string
          # (e.g. `scp $SSH_OPTS ...`) is subject to word-splitting, a
          # latent fragility even though none of these fixed values
          # currently contain a space (caught in review, PR #37).
          SSH_OPTS=(-i "$KEY_FILE" -o StrictHostKeyChecking=accept-new)
          REMOTE="${DEPLOY_USER}@${DROPLET_HOST}"
          REMOTE_TARBALL="/tmp/release-${VERSION}.tar.gz"

          scp "${SSH_OPTS[@]}" release.tar.gz "${REMOTE}:${REMOTE_TARBALL}"
          ssh "${SSH_OPTS[@]}" "$REMOTE" \
            "sudo SERVICES=ghs-api.service HEALTH_URL=http://127.0.0.1:3001/healthz /opt/deploy/scripts/deploy-release.sh ghs '${VERSION}' '${REMOTE_TARBALL}'"
          ssh "${SSH_OPTS[@]}" "$REMOTE" "rm -f '${REMOTE_TARBALL}'"
